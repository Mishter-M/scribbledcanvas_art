name: Simple Deploy

on:
  push:
    branches:
      - main

env:
  STACK_NAME: artforge-portfolio-prod
  AWS_REGION: ${{ secrets.AWS_REGION }}

jobs:
  deploy:
    name: Build and Deploy to AWS
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Use Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build and Export Static Site
        run: npm run build

      - name: Inject API endpoint
        run: ./scripts/inject-api-endpoint.sh

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v1
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Deploy to AWS
        run: |
          echo "=== Starting Simple AWS Deployment ==="
          set -e  # Exit on any error
          
          # Generate unique temp stack name
          TIMESTAMP=$(date +%s)
          TEMP_STACK_NAME="${STACK_NAME}-temp-${TIMESTAMP}"
          
          echo "🔄 Creating new temporary stack: $TEMP_STACK_NAME"
          
          # Deploy CloudFormation stack
          aws cloudformation deploy \
            --template-file aws/cloudformation-template.yaml \
            --stack-name $TEMP_STACK_NAME \
            --parameter-overrides \
                ProjectName=artforge-portfolio \
                Environment=prod \
            --capabilities CAPABILITY_NAMED_IAM \
            --region $AWS_REGION \
            --no-fail-on-empty-changeset
          
          echo "✅ CloudFormation deployment completed successfully"

          # Get stack outputs
          WEBSITE_BUCKET=$(aws cloudformation describe-stacks \
            --stack-name $TEMP_STACK_NAME \
            --query 'Stacks[0].Outputs[?OutputKey==`WebsiteBucketName`].OutputValue' \
            --output text \
            --region $AWS_REGION)

          CLOUDFRONT_DISTRIBUTION_ID=$(aws cloudformation describe-stacks \
            --stack-name $TEMP_STACK_NAME \
            --query 'Stacks[0].Outputs[?OutputKey==`CloudFrontDistributionId`].OutputValue' \
            --output text \
            --region $AWS_REGION)

          WEBSITE_URL=$(aws cloudformation describe-stacks \
            --stack-name $TEMP_STACK_NAME \
            --query 'Stacks[0].Outputs[?OutputKey==`WebsiteURL`].OutputValue' \
            --output text \
            --region $AWS_REGION)

          # Upload website files to S3
          echo "Uploading website files to S3..."
          aws s3 sync out/ s3://$WEBSITE_BUCKET --delete --region $AWS_REGION
          
          # Verify upload worked
          UPLOAD_COUNT=$(aws s3 ls s3://$WEBSITE_BUCKET --recursive | wc -l)
          echo "✅ Uploaded files count: $UPLOAD_COUNT"
          
          if [ "$UPLOAD_COUNT" -eq 0 ]; then
            echo "❌ No files were uploaded to S3!"
            exit 1
          fi

          # Invalidate CloudFront cache
          echo "Invalidating CloudFront cache..."
          aws cloudfront create-invalidation \
            --distribution-id $CLOUDFRONT_DISTRIBUTION_ID \
            --paths "/*" \
            --region $AWS_REGION

          echo "🎉 Deployment completed successfully!"
          echo "🌐 Website URL: $WEBSITE_URL"
          echo "📋 Stack Name: $TEMP_STACK_NAME"
          echo "🪣 S3 Bucket: $WEBSITE_BUCKET"
