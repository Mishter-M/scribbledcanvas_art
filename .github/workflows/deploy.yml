name: Robust Deploy with Rollback

on:
  push:
    branches:
      - main

env:
  STACK_NAME: artforge-portfolio-prod
  AWS_REGION: ${{ secrets.AWS_REGION }}

jobs:
  deploy:
    name: Deploy with Rollback Protection
    runs-on: ubuntu-latest
    
    outputs:
      deployment-status: ${{ steps.deployment.outcome }}
      new-stack-name: ${{ steps.deployment.outputs.new-stack-name }}
      previous-stack-name: ${{ steps.deployment.outputs.previous-stack-name }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Use Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build and Export Static Site
        run: npm run build

      - name: Inject API endpoint
        run: ./scripts/inject-api-endpoint.sh

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v1
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Create Stack Policy for Critical Resource Protection
        run: |
          cat > stack-policy.json << 'EOF'
          {
            "Statement": [
              {
                "Effect": "Allow",
                "Principal": "*",
                "Action": "Update:*",
                "Resource": "*"
              },
              {
                "Effect": "Deny",
                "Principal": "*",
                "Action": "Update:Delete",
                "Resource": "*",
                "Condition": {
                  "StringEquals": {
                    "ResourceType": [
                      "AWS::CloudFront::Distribution",
                      "AWS::CloudFront::CloudFrontOriginAccessIdentity"
                    ]
                  }
                }
              }
            ]
          }
          EOF

      - name: Pre-Deployment Validation
        run: |
          echo "🔍 Validating CloudFormation template..."
          
          # Validate template syntax
          VALIDATION_OUTPUT=$(mktemp)
          if ! aws cloudformation validate-template --template-body file://aws/cloudformation-template.yaml > $VALIDATION_OUTPUT 2>&1; then
            echo "❌ CloudFormation template validation failed:"
            cat $VALIDATION_OUTPUT
            exit 1
          fi
          
          # Check required files exist
          if [ ! -f "aws/cloudformation-template.yaml" ]; then
            echo "❌ CloudFormation template not found"
            exit 1
          fi
          
          if [ ! -f "stack-policy.json" ]; then
            echo "❌ Stack policy file not found"
            exit 1
          fi
          
          # Check template capabilities
          echo "📋 Template validation results:"
          cat $VALIDATION_OUTPUT
          
          echo "✅ Pre-deployment validation passed"

      - name: Deploy with Rollback Protection
        id: deployment
        run: |
          echo "=== Robust Deployment with Rollback ==="
          
          # Find current active stack
          CURRENT_STACK=$(aws cloudformation list-stacks \
            --stack-status-filter CREATE_COMPLETE UPDATE_COMPLETE \
            --query "StackSummaries[?contains(StackName, '${STACK_NAME}')].{Name:StackName,Created:CreationTime}" \
            --output text \
            --region $AWS_REGION 2>/dev/null | sort -k2 -r | head -1 | awk '{print $1}' || echo "")
          
          if [ ! -z "$CURRENT_STACK" ]; then
            echo "📋 Current active stack: $CURRENT_STACK"
            echo "previous-stack-name=$CURRENT_STACK" >> $GITHUB_OUTPUT
          else
            echo "⚠️ No current active stack found"
            echo "previous-stack-name=" >> $GITHUB_OUTPUT
          fi
          
          # Generate new stack name
          TIMESTAMP=$(date +%s)
          NEW_STACK_NAME="${STACK_NAME}-${TIMESTAMP}"
          echo "new-stack-name=$NEW_STACK_NAME" >> $GITHUB_OUTPUT
          
          echo "� Creating new stack: $NEW_STACK_NAME"
          
          # Deploy new stack with enhanced error handling
          echo "📦 Starting CloudFormation deployment..."
          DEPLOY_OUTPUT=$(mktemp)
          
          if aws cloudformation deploy \
            --template-file aws/cloudformation-template.yaml \
            --stack-name $NEW_STACK_NAME \
            --parameter-overrides \
                ProjectName=artforge-portfolio \
                Environment=prod \
            --capabilities CAPABILITY_NAMED_IAM \
            --region $AWS_REGION \
            --no-fail-on-empty-changeset 2>&1 | tee $DEPLOY_OUTPUT; then
            
            # Set stack policy to protect critical resources
            aws cloudformation set-stack-policy \
              --stack-name $NEW_STACK_NAME \
              --stack-policy-body file://stack-policy.json \
              --region $AWS_REGION
            
            echo "✅ Stack deployment successful"
            
            # Get stack outputs
            WEBSITE_BUCKET=$(aws cloudformation describe-stacks \
              --stack-name $NEW_STACK_NAME \
              --query 'Stacks[0].Outputs[?OutputKey==`WebsiteBucketName`].OutputValue' \
              --output text \
              --region $AWS_REGION)

            CLOUDFRONT_DISTRIBUTION_ID=$(aws cloudformation describe-stacks \
              --stack-name $NEW_STACK_NAME \
              --query 'Stacks[0].Outputs[?OutputKey==`CloudFrontDistributionId`].OutputValue' \
              --output text \
              --region $AWS_REGION)

            WEBSITE_URL=$(aws cloudformation describe-stacks \
              --stack-name $NEW_STACK_NAME \
              --query 'Stacks[0].Outputs[?OutputKey==`WebsiteURL`].OutputValue' \
              --output text \
              --region $AWS_REGION)

            # Upload website files
            echo "📁 Uploading website files to S3..."
            if aws s3 sync out/ s3://$WEBSITE_BUCKET --delete --region $AWS_REGION; then
              
              # Verify upload
              UPLOAD_COUNT=$(aws s3 ls s3://$WEBSITE_BUCKET --recursive | wc -l)
              echo "✅ Uploaded $UPLOAD_COUNT files successfully"
              
              if [ "$UPLOAD_COUNT" -gt 0 ]; then
                # Invalidate CloudFront cache
                aws cloudfront create-invalidation \
                  --distribution-id $CLOUDFRONT_DISTRIBUTION_ID \
                  --paths "/*" \
                  --region $AWS_REGION

                echo "🎉 Deployment completed successfully!"
                echo "🌐 Website URL: $WEBSITE_URL"
                echo "📋 New Stack: $NEW_STACK_NAME"
                exit 0
              else
                echo "❌ File upload verification failed"
                exit 1
              fi
            else
              echo "❌ S3 upload failed"
              exit 1
            fi
          else
            echo "❌ CloudFormation deployment failed"
            echo "📋 Deployment output:"
            cat $DEPLOY_OUTPUT || echo "No deployment output available"
            
            # Get stack events for detailed error information
            echo "📋 Stack events (last 10):"
            aws cloudformation describe-stack-events \
              --stack-name $NEW_STACK_NAME \
              --query 'StackEvents[:10].{Time:Timestamp,Status:ResourceStatus,Reason:ResourceStatusReason,Resource:LogicalResourceId}' \
              --output table \
              --region $AWS_REGION || echo "Could not retrieve stack events"
            
            exit 1
          fi

      - name: Cleanup and Rollback on Failure
        if: failure()
        run: |
          echo "=== Cleanup and Rollback Process ==="
          
          NEW_STACK_NAME="${{ steps.deployment.outputs.new-stack-name }}"
          PREVIOUS_STACK_NAME="${{ steps.deployment.outputs.previous-stack-name }}"
          
          if [ ! -z "$NEW_STACK_NAME" ]; then
            echo "🧹 Cleaning up failed deployment stack: $NEW_STACK_NAME"
            
            # Check if new stack exists and delete it
            if aws cloudformation describe-stacks --stack-name $NEW_STACK_NAME --region $AWS_REGION >/dev/null 2>&1; then
              echo "Deleting failed stack..."
              aws cloudformation delete-stack --stack-name $NEW_STACK_NAME --region $AWS_REGION
              
              echo "Waiting for stack deletion..."
              aws cloudformation wait stack-delete-complete --stack-name $NEW_STACK_NAME --region $AWS_REGION || true
              echo "✅ Failed stack cleaned up"
            fi
          fi
          
          if [ ! -z "$PREVIOUS_STACK_NAME" ]; then
            echo "🔄 Previous stack still active: $PREVIOUS_STACK_NAME"
            echo "✅ Automatic rollback to previous working version"
            
            # Get previous stack URL
            PREVIOUS_URL=$(aws cloudformation describe-stacks \
              --stack-name $PREVIOUS_STACK_NAME \
              --query 'Stacks[0].Outputs[?OutputKey==`WebsiteURL`].OutputValue' \
              --output text \
              --region $AWS_REGION 2>/dev/null || echo "N/A")
            
            echo "� Website remains available at: $PREVIOUS_URL"
          else
            echo "⚠️ No previous stack to rollback to"
          fi

      - name: Deployment Summary
        if: always()
        run: |
          echo "=== Deployment Summary ==="
          
          if [ "${{ steps.deployment.outcome }}" == "success" ]; then
            echo "✅ Status: SUCCESS"
            echo "🌐 New deployment active"
            
            # Optionally clean up old stacks (keep last 2)
            echo "🧹 Cleaning up old deployment stacks..."
            aws cloudformation list-stacks \
              --stack-status-filter CREATE_COMPLETE UPDATE_COMPLETE \
              --query "StackSummaries[?contains(StackName, '${STACK_NAME}') && StackName != '${{ steps.deployment.outputs.new-stack-name }}'].StackName" \
              --output text \
              --region $AWS_REGION | tr '\t' '\n' | head -n -1 | while read -r OLD_STACK; do
              if [ ! -z "$OLD_STACK" ]; then
                echo "Deleting old stack: $OLD_STACK"
                aws cloudformation delete-stack --stack-name $OLD_STACK --region $AWS_REGION || true
              fi
            done
          else
            echo "❌ Status: FAILED"
            echo "🔄 Rollback completed - previous version remains active"
          fi
